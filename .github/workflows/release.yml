name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build portable exe + installer + zip
        run: npx electron-builder --win portable nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: 桌面文件小组件 ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          body: |
            - **DesktopFileWidget-*-portable.exe**：便携版，下载后双击运行（推荐）
            - **DesktopFileWidget-*-setup.exe**：安装版，带开始菜单/桌面快捷方式
            - **\*-win.zip**：免安装压缩包，解压后运行 `桌面文件小组件.exe`

            > 未签名，首次运行若出现 SmartScreen 提示，点「更多信息 → 仍要运行」。
          files: |
            dist/*.exe
            dist/*.zip
